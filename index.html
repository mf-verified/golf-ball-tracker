<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>High-Performance Tracker</title>
        <style>
            :root {
                --bg: #0d0d0d;
                --jar-glass: rgba(255, 255, 255, 0.1);
                --text: #fff;
            }
            /* Theme Toggles */
            body.midsummer-theme {
                --bg: #87ceeb;
                --jar-glass: rgba(255, 255, 255, 0.5);
                --text: #004d40;
            }
            body.easter-theme {
                --bg: #fdfae6;
                --jar-glass: rgba(255, 255, 255, 0.4);
                --text: #4e342e;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: sans-serif;
                overflow: hidden;
                transition: background 0.5s ease;
            }
            .stage {
                display: flex;
                width: 100vw;
                height: 100vh;
            }
            .wrapper {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                padding: 20px;
            }
            .counter {
                font-size: 8vw;
                font-weight: 900;
                margin: 0;
            }
            .label {
                text-transform: uppercase;
                letter-spacing: 5px;
                opacity: 0.7;
                margin-bottom: 10px;
            }

            canvas {
                background: var(--jar-glass);
                border: 4px solid rgba(255, 255, 255, 0.2);
                border-top: none;
                border-radius: 0 0 50px 50px;
                max-width: 90%;
                height: 60vh; /* Scaled via JS */
            }
        </style>
    </head>
    <body class="">
        <!-- Toggle class here -->

        <div class="stage">
            <div class="wrapper">
                <p id="count-red" class="counter">0</p>
                <p class="label">Primary</p>
                <canvas id="canvas-red"></canvas>
            </div>
            <div class="wrapper">
                <p id="count-mix" class="counter">0</p>
                <p class="label">Mixed</p>
                <canvas id="canvas-mix"></canvas>
            </div>
        </div>

        <script>
            const CSV_URL =
                "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTei2ZyJcEUL0LOH-_5IFqjdhN_CUUKHZJCgDGsestEjzuX-C9ifRu9VrT0ChJRPWSbbfQTVSCd2cw/pub?gid=0&single=true&output=csv";
            let lastData = ""; // Store last fetch to prevent unnecessary redrawing

            // Theme Definitions
            const themes = {
                standard: {
                    red: "#ff4d4d",
                    green: "#b2ff59",
                    blue: "#40c4ff",
                    shape: "circle",
                },
                easter: {
                    red: "#ff8a80",
                    green: "#dce775",
                    blue: "#81d4fa",
                    shape: "egg",
                },
                midsummer: {
                    red: "#ff5252",
                    green: "#aed581",
                    blue: "#4fc3f7",
                    shape: "leaf",
                },
            };

            async function update() {
                try {
                    const res = await fetch(CSV_URL + "?t=" + Date.now());
                    const text = await res.text();

                    // OPTIMIZATION: Only proceed if data has changed
                    if (text === lastData) return;
                    lastData = text;

                    const rows = text.split("\n");
                    const vals = rows[1].split(",");
                    const data = {
                        red: parseInt(vals[0]) || 0,
                        green: parseInt(vals[1]) || 0,
                        blue: parseInt(vals[2]) || 0,
                    };

                    document.getElementById("count-red").innerText =
                        data.red.toLocaleString();
                    document.getElementById("count-mix").innerText = (
                        data.green + data.blue
                    ).toLocaleString();

                    render(data);
                } catch (e) {
                    console.error("Update failed", e);
                }
            }

            function render(data) {
                const currentThemeKey =
                    document.body.className.replace("-theme", "") || "standard";
                const theme = themes[currentThemeKey];

                const maxBalls = Math.max(data.red, data.green + data.blue);

                // Draw Jars
                drawToCanvas(
                    "canvas-red",
                    data.red,
                    [theme.red],
                    maxBalls,
                    theme.shape,
                );

                const mixColors = Array(data.green)
                    .fill(theme.green)
                    .concat(Array(data.blue).fill(theme.blue));
                drawToCanvas(
                    "canvas-mix",
                    mixColors.length,
                    mixColors.sort(() => Math.random() - 0.5),
                    maxBalls,
                    theme.shape,
                );
            }

            function drawToCanvas(id, count, colors, maxForScaling, shape) {
                const canvas = document.getElementById(id);
                const ctx = canvas.getContext("2d");

                // Set internal resolution
                canvas.width = canvas.offsetWidth * window.devicePixelRatio;
                canvas.height = canvas.offsetHeight * window.devicePixelRatio;

                const w = canvas.width;
                const h = canvas.height;

                // Dynamic Sizing
                const area = w * h * 0.8;
                const ballSize = Math.max(
                    Math.min(Math.sqrt(area / maxForScaling), w / 5),
                    10,
                );

                ctx.clearRect(0, 0, w, h);

                let x = ballSize;
                let y = h - ballSize;

                for (let i = 0; i < count; i++) {
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.beginPath();

                    // Draw based on shape
                    if (shape === "egg") {
                        ctx.ellipse(
                            x,
                            y,
                            ballSize / 2,
                            ballSize / 1.5,
                            0,
                            0,
                            Math.PI * 2,
                        );
                    } else if (shape === "leaf") {
                        ctx.moveTo(x, y - ballSize / 2);
                        ctx.quadraticCurveTo(
                            x + ballSize / 2,
                            y,
                            x,
                            y + ballSize / 2,
                        );
                        ctx.quadraticCurveTo(
                            x - ballSize / 2,
                            y,
                            x,
                            y - ballSize / 2,
                        );
                    } else {
                        ctx.arc(x, y, ballSize / 2, 0, Math.PI * 2);
                    }

                    ctx.fill();
                    ctx.strokeStyle = "rgba(0,0,0,0.1)";
                    ctx.stroke();

                    // Advanced wrapping logic
                    x += ballSize + 2;
                    if (x > w - ballSize) {
                        x = ballSize;
                        y -= ballSize + 2;
                    }
                }
            }

            setInterval(update, 10000); // Check every 10s
            window.addEventListener("resize", () => {
                lastData = "";
                update();
            });
            update();
        </script>
    </body>
</html>
